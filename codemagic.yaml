workflows:
  ionic-react-android:
    name: Ionic React Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 16.20.2 
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main' # Agar branch master hai to yahan master karein
    scripts:
      - name: Fix old node-sass issue
        script: |
          npm uninstall node-sass
          npm install sass --save-dev
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Web Production Assets
        script: |
          npm run build
      - name: Add Android Platform
        script: |
          # Agar android folder nahi hai, to yeh command use create karegi
          npx cap add android
      - name: Copy Web Assets to Capacitor Android Platform
        script: |
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - saadzubair3566@gmail.com # Apna email yahan dalein
        notify:
          success: true
          failure: true
          
