workflows:
  ionic-react-android:
    name: Ionic React Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main' # Agar aapki branch ka naam 'master' hai to yahan master likhein
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build Web Production Assets
        script: |
          npm run build
      - name: Copy Web Assets to Capacitor Android Platform
        script: |
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com # Yahan apna sahi email address dalein
        notify:
          success: true
          failure: true
          
